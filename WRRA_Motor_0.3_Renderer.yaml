renderer:
  name: WRRA-Motor Protein Renderer
  version: "0.3"
  core: "WRRA Core 1.0 (frozen)"
  mode: "hybrid scaffold search with fail-closed de novo boundary"
  seed: 260908

input_contract:
  required_functions:
    - energy_transduction
    - polar_track_binding
    - two_contact_architecture
    - present_state_gate
    - inter_contact_coordination
  strict_processivity: true
  autonomous_operation: true

ownership:
  inherited_motor_core:
    source: "human KIF5B residues 1-353, UniProt P33176"
    class: INHERITED
  generated_gate:
    source: "heptad grammar generated by this renderer"
    class: DESIGNED
  reverse_translated_DNA:
    source: "constraint-aware deterministic reverse translation"
    class: PREDICTED

search:
  candidates: 512
  heptads: 4
  hinge: GAAA
  keep_top: 5

hard_filters:
  preserve_motor_core_exactly: true
  require_p_loop_motif: IFAYGQTSSGKT
  forbid_proline_in_gate: true
  require_hydrophobic_a_d_positions: true
  require_opposite_charge_e_g_positions: true
  maximum_gate_charge_density: 0.45

DNA_renderer:
  host_profile: "generic human nuclear expression"
  target_GC: 0.58
  append_stop: TAA
  forbidden_sites:
    - GAATTC
    - AAGCTT
    - GGATCC
    - GGTCTC
    - CGTCTC
  exclusions:
    - promoter
    - Kozak_sequence
    - UTRs
    - polyadenylation_signal
    - vector_backbone

claim_contract:
  H1: CALIBRATION
  H2: PREDICTED_SEQUENCE_ONLY
  N1: FAIL_CLOSED_UNTIL_MULTISTATE_STRUCTURE_AND_MECHANOCHEMICAL_VALIDATION

